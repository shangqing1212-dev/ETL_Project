[project]
name = "mock-api"
version = "0.1.0"
description = "模拟电商平台 API(认证/分页/限流/故障注入)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "faker>=28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_api"]
