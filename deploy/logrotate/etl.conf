# ETL 相关日志轮转(生产 Linux 放 /etc/logrotate.d/,按需调整路径)
# 覆盖: Airflow 容器日志(挂载卷)、SDK 应用日志、MySQL 慢查询(容器内,由 mysql 自身策略处理)。
# 验证: logrotate -d /etc/logrotate.d/etl.conf

/var/lib/etl/airflow/logs/**/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/etl/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
