name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run mypy sdk/src mock_api/src
      - run: uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      # ubuntu-latest 自带 docker,testcontainers 直接可用
      - run: uv run pytest tests/integration -q

  e2e:
    # 故障注入 E2E: 真实 mock API(uvicorn 进程内)+ 真实 MySQL + SDK 重试/幂等链路
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run pytest tests/e2e -q

  airflow-parse:
    # DAG 解析验证: 在官方 Airflow 镜像容器内装 SDK、跑 dags list / tasks list。
    # Airflow 不支持 Windows/非容器环境,本地无法跑;这里保证 DAG 语法与 provider 注册始终有效。
    runs-on: ubuntu-latest
    container: apache/airflow:3.3.1-python3.12
    env:
      AIRFLOW__CORE__EXECUTOR: airflow.executors.sequential_executor.SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK into image
        run: pip install --no-cache-dir ./sdk
      - name: Initialize metadata (SQLite, parse-only)
        run: airflow db migrate
      - name: Copy DAGs
        run: cp -r dags/. /opt/airflow/dags/
      - name: Verify provider registration
        run: airflow providers list | grep -E "etl-sdk"
      - name: List DAGs (解析验证)
        run: airflow dags list
      - name: List tasks
        run: |
          airflow tasks list etl_orders
          airflow tasks list dws_daily
          airflow tasks list dq_monitor
